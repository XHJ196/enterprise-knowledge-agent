server:
  port: 8080

spring:
  application:
    name: enterprise-knowledge

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5333/enterprise_knowledge}
    username: ${DB_USERNAME:MicroJason}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core

  flyway:
    enabled: true
    default-schema: core
    schemas: core
    create-schemas: true
    locations: classpath:db/migration
    clean-disabled: true

  sql:
    init:
      mode: never